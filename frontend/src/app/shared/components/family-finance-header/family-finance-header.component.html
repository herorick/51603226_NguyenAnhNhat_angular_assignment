<header class="page-header">
  <a class="brand" [routerLink]="homePath()" aria-label="Family Finance home">
    <span class="brand-mark" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false"
        aria-hidden="true">
        <path
          d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
        <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
      </svg>
    </span>
    <span>Family Finance</span>
  </a>

  <span class="header-spacer"></span>

  <div class="account-menu">
    <button
      #accountTrigger
      type="button"
      class="account-trigger"
      aria-controls="account-menu-panel"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="familyName + ' account menu'"
      (click)="toggleMenu()">
      <span class="user-name">{{ familyName }}</span>
      <span class="avatar" aria-hidden="true">{{ initials }}</span>
      <svg
        class="account-chevron"
        [class.is-open]="menuOpen()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false"
        aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    <div id="account-menu-panel" class="account-panel" [hidden]="!menuOpen()">
      <div class="account-summary">
        <span class="avatar avatar--lg" aria-hidden="true">{{ initials }}</span>
        <div>
          <p class="account-name">{{ familyName }}</p>
          <p class="account-meta">Family budget · VND</p>
        </div>
      </div>
      <ul class="account-links" aria-label="Account shortcuts">
        <li><a [routerLink]="homePath()" (click)="closeMenu()">This month's spending</a></li>
        <li><a routerLink="/monthly-plans" (click)="closeMenu()">All months</a></li>
        <li><a routerLink="/monthly-planning" (click)="closeMenu()">Create monthly plan</a></li>
        <li><a routerLink="/expenses/new" (click)="closeMenu()">Add expense</a></li>
        <li><a routerLink="/compare" (click)="closeMenu()">Compare months</a></li>
      </ul>
    </div>
  </div>
</header>
